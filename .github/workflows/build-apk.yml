
name: Construir APK ECO-RASTRO

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar proyecto
        uses: actions/checkout@v4

      - name: Instalar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Descomprimir proyecto
        run: |
          mkdir proyecto
          unzip -q Eco-Rastro-GitHub-Android.zip -d proyecto

      - name: Encontrar proyecto Android
        run: |
          PROJECT_DIR=$(dirname "$(find proyecto \( -name settings.gradle -o -name settings.gradle.kts \) | head -n 1)")
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV
          test -n "$PROJECT_DIR"

      - name: Corregir compatibilidad Java 17
        run: |
          find "$PROJECT_DIR" -type f \( -name '*.gradle' -o -name '*.gradle.kts' \) -exec sed -i 's/1\.8/17/g; s/VERSION_1_8/VERSION_17/g' {} +

      - name: Compilar aplicación
        run: gradle -p "$PROJECT_DIR" assembleDebug --no-daemon

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: ECO-RASTRO-APK
          path: proyecto/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          
